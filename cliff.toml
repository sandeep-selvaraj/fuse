# git-cliff configuration — https://git-cliff.org
# Generates CHANGELOG.md from Conventional Commits.

[changelog]
# Rendered once at the top of the changelog.
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated by [git-cliff](https://git-cliff.org) from \
[Conventional Commits](https://www.conventionalcommits.org).\n
"""
# Rendered for each release (Tera template).
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }}))
    {% endfor %}\
{% endfor %}\n
"""
footer = ""
trim = true
postprocessors = [
    { pattern = '\$REPO', replace = "https://github.com/sandeep-selvaraj/fuse" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Strip leading/trailing whitespace from messages.
commit_preprocessors = []
# Map commit types to changelog sections.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactor" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^build", group = "<!-- 6 -->Build System" },
    { message = "^ci", group = "<!-- 7 -->CI/CD" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore", group = "<!-- 8 -->Miscellaneous" },
    { message = "^.*", group = "<!-- 8 -->Miscellaneous" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
